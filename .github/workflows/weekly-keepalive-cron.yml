name: Weekly Notes Keepalive (Supabase anti-pause)

on:
  schedule:
    # Run weekly (every Monday at 10:00 UTC). Adjust hour as desired.
    # This posts a public note + a system/private note via the admin API,
    # using the Playwright CLI (bunx playwright test) against the live
    # E2E_PROD_BASE_URL (which is backed by the real Supabase DB).
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (defaults to production secret)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  weekly-keepalive:
    name: Post weekly public + private keepalive notes (Playwright CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.E2E_PROD_BASE_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
      CLERK_FAPI: ${{ secrets.CLERK_FAPI }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      CLERK_TEST_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
      E2E_ADMIN_API_KEY: ${{ secrets.E2E_ADMIN_API_KEY }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Validate required base URL
        run: |
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "E2E_BASE_URL is empty. Set secret E2E_PROD_BASE_URL or provide workflow_dispatch input base_url."
            exit 1
          fi

      - name: Wait for deployment to be ready
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          BASE="${E2E_BASE_URL%/}"
          log_response() {
            local url="$1" code="$2" body="$3"
            echo "[wait] GET $url -> HTTP $code" >&2
          }

          # --- Improved versions endpoint logic (primary signal) ---
          # The /versions (and /api/versions) endpoint returns { commitSha, ... } from VERCEL_GIT_COMMIT_SHA or GIT_COMMIT_SHA.
          # We poll it persistently with good logging and tolerant matching (full SHA or prefix).
          # This is the same mechanism used by the main e2e workflows.
          if [ -n "$EXPECTED_SHA" ]; then
            echo "Polling $BASE for commit $EXPECTED_SHA via /versions (primary) + health+admin-probe fallback (max ~4 min)..."
            VERSIONS_MATCHED=false

            for i in $(seq 1 48); do
              VERSIONS_GOT_SHA=""

              for path in "/versions" "/api/versions"; do
                RESP=$(curl -s -w "\n%{http_code}" --max-time 8 "$BASE$path" || true)
                CODE=$(echo "$RESP" | tail -n1)
                BODY=$(echo "$RESP" | sed '$d')

                if [ "$CODE" = "200" ]; then
                  # Robust extraction + trim
                  RAW_SHA=$(echo "$BODY" | jq -r '.commitSha // empty' 2>/dev/null | tr -d ' \n\r' || true)
                  if [ -n "$RAW_SHA" ]; then
                    VERSIONS_GOT_SHA="$RAW_SHA"
                    echo "[wait] $path returned commitSha='${RAW_SHA}' (expected='${EXPECTED_SHA}') attempt $i"

                    # Tolerant match: exact, or one is prefix of the other (handles short vs full SHA)
                    if [ "$RAW_SHA" = "$EXPECTED_SHA" ] || [[ "$EXPECTED_SHA" == "$RAW_SHA"* ]] || [[ "$RAW_SHA" == "$EXPECTED_SHA"* ]]; then
                      echo "Deployment ready via versions (commit $EXPECTED_SHA is live at $path)."
                      VERSIONS_MATCHED=true
                      exit 0
                    fi
                  else
                    echo "[wait] $path returned 200 but no commitSha in payload (attempt $i)"
                  fi
                fi
              done

              if [ -n "$VERSIONS_GOT_SHA" ]; then
                echo "[wait] versions present but SHA mismatch (got '$VERSIONS_GOT_SHA')"
              fi

              # Fallback health + targeted admin probe (user-requested improvement for the private note route)
              # We still prefer versions, but this lets us proceed when versions signal is unreliable in this env.
              HEALTH_OK=false
              for path in "/health" "/api/health" "/api/public-notes"; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$BASE$path" || echo "000")
                if [ "$CODE" = "200" ]; then
                  HEALTH_OK=true
                  echo "[wait] Basic health OK at $path (attempt $i)"
                  break
                fi
              done

              if $HEALTH_OK; then
                # Probe the admin create route (the one the "private" keepalive depends on)
                ADMIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 -X POST "$BASE/api/notes/admin/create" \
                  -H "content-type: application/json" \
                  -H "x-api-key: ${E2E_ADMIN_API_KEY}" \
                  -d '{"title":"__keepalive-probe__","content":"probe","isPublic":false}' || echo "000")

                if [ "$ADMIN_CODE" != "404" ] && [ "$ADMIN_CODE" != "000" ]; then
                  echo "Admin create route responding (HTTP $ADMIN_CODE). New code is live."
                  exit 0
                else
                  echo "Admin create still returning $ADMIN_CODE (waiting for full deploy of new route)..."
                fi
              fi

              echo "Attempt $i/48: no matching versions SHA yet, sleeping 5s..."
              sleep 5
            done

            echo "Warning: Timed out waiting for exact versions SHA match. Proceeding with best-effort (admin probe may still create the private note once the route is live, or fall back to public notes)."
          else
            echo "No EXPECTED_SHA; doing basic readiness check..."
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$BASE/api/public-notes" || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "Public notes endpoint responding."
                exit 0
              fi
              sleep 5
            done
          fi

      - name: Install dependencies
        run: bun install && cd e2e-tests && bun install
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}

      - name: Install Playwright (API/request only - no browser needed for keepalive)
        # We only use the request fixture + headers for public + admin-key calls.
        # No headed browser or globalSetup (Clerk sign-in) is required.
        working-directory: e2e-tests
        run: echo "Playwright package already installed via bun; skipping heavy browser install for speed."

      - name: Run keepalive via Playwright CLI (posts public + private notes)
        working-directory: e2e-tests
        run: bunx playwright test -c keepalive.config.cjs tests/cron-keepalive.spec.ts --reporter=line --retries=1

      - name: Upload Playwright report (keepalive)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-keepalive
          path: e2e-tests/playwright-report
          if-no-files-found: ignore
