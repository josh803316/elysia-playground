name: Weekly Notes Keepalive (Supabase anti-pause)

on:
  schedule:
    # Run weekly (every Monday at 10:00 UTC). Adjust hour as desired.
    # This posts a public note + a system/private note via the admin API,
    # using the Playwright CLI (bunx playwright test) against the live
    # E2E_PROD_BASE_URL (which is backed by the real Supabase DB).
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (defaults to production secret)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  weekly-keepalive:
    name: Post weekly public + private keepalive notes (Playwright CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.E2E_PROD_BASE_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
      CLERK_FAPI: ${{ secrets.CLERK_FAPI }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      CLERK_TEST_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
      E2E_ADMIN_API_KEY: ${{ secrets.E2E_ADMIN_API_KEY }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Validate required base URL
        run: |
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "E2E_BASE_URL is empty. Set secret E2E_PROD_BASE_URL or provide workflow_dispatch input base_url."
            exit 1
          fi

      - name: Wait for deployment to be ready
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          BASE="${E2E_BASE_URL%/}"
          log_response() {
            local url="$1" code="$2" body="$3"
            echo "[wait] GET $url -> HTTP $code" >&2
          }

          # First try to wait for the specific commit SHA (if /versions is exposed)
          if [ -n "$EXPECTED_SHA" ]; then
            echo "Polling $BASE for commit $EXPECTED_SHA to be live (max ~3 min)..."
            for i in $(seq 1 36); do
              for path in "/versions" "/api/versions"; do
                RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
                CODE=$(echo "$RESP" | tail -n1)
                BODY=$(echo "$RESP" | sed '$d')
                if [ "$CODE" = "200" ]; then
                  COMMIT_SHA=$(echo "$BODY" | jq -r '.commitSha // empty' 2>/dev/null || true)
                  if [ -n "$COMMIT_SHA" ] && [ "$COMMIT_SHA" = "$EXPECTED_SHA" ]; then
                    echo "Deployment ready (commit $EXPECTED_SHA is live)."
                    exit 0
                  fi
                fi
              done

              # Fallback: at least check basic health so we don't run against completely stale deploys
              for path in "/health" "/api/health" "/api/public-notes"; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path" || echo "000")
                if [ "$CODE" = "200" ]; then
                  echo "Basic endpoint responding (HTTP 200 at $path). Proceeding (SHA check may not be available for this backend)."
                  exit 0
                fi
              done

              echo "Attempt $i/36: not ready yet, sleeping 5s..."
              sleep 5
            done
            echo "Warning: Could not confirm exact SHA. Proceeding anyway (the keepalive may create only public notes if the admin route is not live yet)."
          else
            echo "No EXPECTED_SHA; doing basic readiness check..."
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/public-notes" || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "Public notes endpoint responding."
                exit 0
              fi
              sleep 5
            done
          fi

      - name: Install dependencies
        run: bun install && cd e2e-tests && bun install
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}

      - name: Install Playwright (API/request only - no browser needed for keepalive)
        # We only use the request fixture + headers for public + admin-key calls.
        # No headed browser or globalSetup (Clerk sign-in) is required.
        working-directory: e2e-tests
        run: echo "Playwright package already installed via bun; skipping heavy browser install for speed."

      - name: Run keepalive via Playwright CLI (posts public + private notes)
        working-directory: e2e-tests
        run: bunx playwright test -c keepalive.config.cjs tests/cron-keepalive.spec.ts --reporter=line --retries=1

      - name: Upload Playwright report (keepalive)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-keepalive
          path: e2e-tests/playwright-report
          if-no-files-found: ignore
