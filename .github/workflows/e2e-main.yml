name: E2E Tests (Main)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (defaults to production URL secret)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e-main:
    name: Run Full E2E on Main
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.E2E_PROD_BASE_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
      CLERK_FAPI: ${{ secrets.CLERK_FAPI }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      CLERK_TEST_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
      E2E_ADMIN_API_KEY: ${{ secrets.E2E_ADMIN_API_KEY }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Validate required base URL
        run: |
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "E2E_BASE_URL is empty. Set secret E2E_PROD_BASE_URL or provide workflow_dispatch input base_url."
            exit 1
          fi

      - name: Install dependencies
        run: bun install && cd e2e-tests && bun install
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}

      - name: Install Playwright Chromium
        working-directory: e2e-tests
        run: bunx playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          BASE="${E2E_BASE_URL%/}"
          log_response() {
            local url="$1" code="$2" body="$3"
            echo "[versions] GET $url -> HTTP $code" >&2
            if [ -n "$body" ]; then
              if [ "${#body}" -gt 500 ]; then
                echo "[versions] response body (first 500 chars): ${body:0:500}..." >&2
              else
                echo "[versions] response body: $body" >&2
              fi
            fi
          }
          fetch_versions() {
            for path in "/versions" "/api/versions"; do
              RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
              CODE=$(echo "$RESP" | tail -n1)
              BODY=$(echo "$RESP" | sed '$d')
              log_response "$BASE$path" "$CODE" "$BODY"
              if [ "$CODE" = "200" ]; then
                echo "$BODY"
                return 0
              fi
            done
            return 1
          }
          if [ -n "$EXPECTED_SHA" ]; then
            echo "Polling for $BASE/versions or $BASE/api/versions until commitSha matches $EXPECTED_SHA (max 2 min)..."
            for i in $(seq 1 24); do
              BODY=$(fetch_versions) || true
              if [ -n "$BODY" ]; then
                COMMIT_SHA=$(echo "$BODY" | jq -r '.commitSha // empty' 2>/dev/null || true)
                if [ -n "$COMMIT_SHA" ] && [ "$COMMIT_SHA" = "$EXPECTED_SHA" ]; then
                  echo "Deployment ready (commit $EXPECTED_SHA is live)."
                  exit 0
                fi
                echo "Attempt $i/24: commit ${COMMIT_SHA:-unknown}, waiting for $EXPECTED_SHA..."
              else
                echo "Attempt $i/24: /versions and /api/versions both 404, trying health fallback..."
                for path in "/health" "/api/health"; do
                  RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
                  CODE=$(echo "$RESP" | tail -n1)
                  BODY=$(echo "$RESP" | sed '$d')
                  echo "[versions] GET $BASE$path -> HTTP $CODE" >&2
                  [ -n "$BODY" ] && echo "[versions] response body: ${BODY:0:300}" >&2
                  if [ "$CODE" = "200" ]; then
                    echo "Deployment responds at $BASE$path (SHA not verified - API may be at different URL)."
                    exit 0
                  fi
                done
                echo "Attempt $i/24: no /versions or /health 200, retrying in 5s..."
              fi
              sleep 5
            done
            echo "Deployment did not match expected SHA in time."
            exit 1
          else
            echo "Polling $BASE/health until 200 (max 2 min)..."
            for i in $(seq 1 24); do
              for path in "/health" "/api/health"; do
                RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
                CODE=$(echo "$RESP" | tail -n1)
                BODY=$(echo "$RESP" | sed '$d')
                echo "[versions] GET $BASE$path -> HTTP $CODE" >&2
                [ -n "$BODY" ] && echo "[versions] response body: ${BODY:0:300}" >&2
                if [ "$CODE" = "200" ]; then
                  echo "Deployment ready (HTTP $CODE at $path)."
                  exit 0
                fi
              done
              echo "Attempt $i/24: no 200, retrying in 5s..."
              sleep 5
            done
            echo "Deployment did not respond with 200 in time."
            exit 1
          fi

      - name: Run full E2E suite
        working-directory: e2e-tests
        run: bun run e2e -- --reporter=line --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-main
          path: e2e-tests/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-main
          path: e2e-tests/test-results
          if-no-files-found: ignore
