name: E2E Tests (Vercel Preview)

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to test (e.g. https://my-branch.vercel.app)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-vercel-preview-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Run Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'preview') &&
        contains(github.event.deployment_status.target_url, 'vercel.app')
      )
    env:
      E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || github.event.deployment_status.target_url }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
      CLERK_FAPI: ${{ secrets.CLERK_FAPI }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      CLERK_TEST_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
      E2E_ADMIN_API_KEY: ${{ secrets.E2E_ADMIN_API_KEY }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install && cd e2e-tests && bun install

      - name: Install Playwright Chromium
        working-directory: e2e-tests
        run: bunx playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          BASE="${E2E_BASE_URL%/}"
          echo "Polling $BASE/health until 200 (max 2 min)..."
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "Deployment ready (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i/24: HTTP $CODE, retrying in 5s..."
            sleep 5
          done
          echo "Deployment did not respond with 200 in time."
          exit 1

      - name: Run E2E tests against preview
        working-directory: e2e-tests
        run: bun run e2e -- --reporter=line --retries=1
        env:
          PLAYWRIGHT_WORKERS: 2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e-tests/test-results
          if-no-files-found: ignore
