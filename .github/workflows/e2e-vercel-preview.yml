name: E2E Tests (Vercel Preview)

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to test (e.g. https://my-branch.vercel.app)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-vercel-preview-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Run Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'preview') &&
        contains(github.event.deployment_status.environment_url || github.event.deployment_status.target_url, 'vercel.app')
      )
    env:
      # Prefer environment_url (preview URL) over target_url when Vercel posts deployment status; see deployment-status action / API.
      E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || (github.event.deployment_status.environment_url || github.event.deployment_status.target_url) }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
      CLERK_FAPI: ${{ secrets.CLERK_FAPI }}
      CLERK_TEST_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
      CLERK_TEST_PASSWORD: ${{ secrets.CLERK_TEST_PASSWORD }}
      E2E_ADMIN_API_KEY: ${{ secrets.E2E_ADMIN_API_KEY }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install && cd e2e-tests && bun install

      - name: Install Playwright Chromium
        working-directory: e2e-tests
        run: bunx playwright install --with-deps chromium

      - name: Log deployment URL (debug)
        run: |
          echo "github.event_name = ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "inputs.preview_url = ${{ inputs.preview_url }}"
            echo "E2E_BASE_URL (resolved) = ${{ github.event_name == 'workflow_dispatch' && inputs.preview_url || (github.event.deployment_status.environment_url || github.event.deployment_status.target_url) }}"
          else
            echo "deployment_status.state = ${{ github.event.deployment_status.state }}"
            echo "deployment_status.environment_url = ${{ github.event.deployment_status.environment_url }}"
            echo "deployment_status.target_url = ${{ github.event.deployment_status.target_url }}"
            echo "deployment.environment = ${{ github.event.deployment.environment }}"
            echo "E2E_BASE_URL (resolved) = ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}"
          fi
          echo "EXPECTED_SHA (github.sha) = ${{ github.sha }}"

      - name: Wait for deployment to be ready
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          BASE="${E2E_BASE_URL%/}"
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            echo "Giving Vercel 30s to propagate the deployment URL..."
            sleep 30
          fi
          log_response() {
            local url="$1" code="$2" body="$3"
            echo "[versions] GET $url -> HTTP $code" >&2
            if [ -n "$body" ]; then
              if [ "${#body}" -gt 500 ]; then
                echo "[versions] response body (first 500 chars): ${body:0:500}..." >&2
              else
                echo "[versions] response body: $body" >&2
              fi
            fi
          }
          fetch_versions() {
            for path in "/versions" "/api/versions"; do
              RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
              CODE=$(echo "$RESP" | tail -n1)
              BODY=$(echo "$RESP" | sed '$d')
              log_response "$BASE$path" "$CODE" "$BODY"
              if echo "$BODY" | grep -q "DEPLOYMENT_NOT_FOUND\|could not be found on Vercel"; then
                echo "::error::E2E_BASE_URL is not a valid Vercel deployment URL (got 'deployment could not be found'). When using deployment_status, GitHub receives target_url from the deployment creator. Ensure your Vercel project is linked to this repo and that Vercel sets target_url to the preview URL (e.g. https://your-project-git-branch.vercel.app). To run E2E against a specific URL, use workflow_dispatch and enter the preview URL manually."
                echo "VERCEL_DEPLOYMENT_NOT_FOUND"
                return 0
              fi
              if [ "$CODE" = "200" ]; then
                echo "$BODY"
                return 0
              fi
            done
            return 1
          }
          if [ "${{ github.event_name }}" = "deployment_status" ] && [ -n "$EXPECTED_SHA" ]; then
            echo "Polling for $BASE/versions or $BASE/api/versions until commitSha matches $EXPECTED_SHA (max 2 min)..."
            for i in $(seq 1 24); do
              BODY=$(fetch_versions) || true
              if [ "$BODY" = "VERCEL_DEPLOYMENT_NOT_FOUND" ]; then
                exit 1
              fi
              if [ -n "$BODY" ]; then
                COMMIT_SHA=$(echo "$BODY" | jq -r '.commitSha // empty' 2>/dev/null || true)
                if [ -n "$COMMIT_SHA" ] && [ "$COMMIT_SHA" = "$EXPECTED_SHA" ]; then
                  echo "Deployment ready (commit $EXPECTED_SHA is live)."
                  exit 0
                fi
                echo "Attempt $i/24: commit ${COMMIT_SHA:-unknown}, waiting for $EXPECTED_SHA..."
              else
                echo "Attempt $i/24: /versions and /api/versions both 404, trying health fallback..."
                for path in "/health" "/api/health"; do
                  RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
                  CODE=$(echo "$RESP" | tail -n1)
                  BODY=$(echo "$RESP" | sed '$d')
                  echo "[versions] GET $BASE$path -> HTTP $CODE" >&2
                  [ -n "$BODY" ] && echo "[versions] response body: ${BODY:0:300}" >&2
                  if [ "$CODE" = "200" ]; then
                    echo "Deployment responds at $BASE$path (SHA not verified - API may be at different URL)."
                    exit 0
                  fi
                done
                echo "Attempt $i/24: no /versions or /health 200, retrying in 5s..."
              fi
              sleep 5
            done
            echo "Deployment did not match expected SHA in time."
            exit 1
          else
            echo "Polling $BASE/health until 200 (max 2 min)..."
            for i in $(seq 1 24); do
              for path in "/health" "/api/health"; do
                RESP=$(curl -s -w "\n%{http_code}" "$BASE$path" || true)
                CODE=$(echo "$RESP" | tail -n1)
                BODY=$(echo "$RESP" | sed '$d')
                echo "[versions] GET $BASE$path -> HTTP $CODE" >&2
                [ -n "$BODY" ] && echo "[versions] response body: ${BODY:0:300}" >&2
                if [ "$CODE" = "200" ]; then
                  echo "Deployment ready (HTTP $CODE at $path)."
                  exit 0
                fi
              done
              echo "Attempt $i/24: no 200, retrying in 5s..."
              sleep 5
            done
            echo "Deployment did not respond with 200 in time."
            exit 1
          fi

      - name: Run E2E tests against preview
        working-directory: e2e-tests
        run: bun run e2e -- --reporter=line --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e-tests/test-results
          if-no-files-found: ignore
