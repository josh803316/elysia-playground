name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  deploy:
    uses: josh803316/shared-ci-workflows/.github/workflows/vercel-production.yml@main
    with:
      app-name: elysia-playground
      vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
      vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
      build-command: 'bun run build'
    secrets: inherit

  release:
    name: Release
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      # semantic-release requires Node >=22.14.0 (Bun reports ~v20 for process.version)
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # Install release tooling — not in package.json to avoid Vercel needing GitHub Packages auth
      # GITHUB_TOKEN must be set here so Bun can expand ${GITHUB_TOKEN} in .npmrc
      - name: Install release dependencies
        run: bun add @josh803316/semantic-release-helper @josh803316/shared-ci-workflows semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN }}
          SEMANTIC_RELEASE_PACKAGE: elysia-playground
          LINEAR_ISSUE_PREFIX: ELY
          LINEAR_WORKSPACE: elysia-playground

      # Mark any ELY-N tickets referenced in commits since the previous tag as Done.
      # Ticket refs are optional — this step is a no-op when none are found.
      - name: Mark Linear tickets Done
        if: success()
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --format="%s" "${PREV_TAG}..HEAD" | tr '\n' ',')
          else
            COMMITS=$(git log --format="%s" -50 | tr '\n' ',')
          fi
          echo "Commit subjects since last release: $COMMITS"
          bunx workflow-linear transition \
            --event-type PR_MERGED \
            --commit-messages "$COMMITS"
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_ISSUE_PREFIX: ELY
