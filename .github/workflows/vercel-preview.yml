name: Vercel Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    uses: josh803316/shared-ci-workflows/.github/workflows/vercel-preview.yml@main
    with:
      app-name: elysia-playground
      vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
      vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
      build-command: 'bun run build'
    secrets: inherit

  chromatic:
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        env:
          # Auth for @josh803316 from GitHub Packages (.npmrc uses GITHUB_TOKEN).
          # Use BUN_AUTH_TOKEN (PAT with read:packages) if the default token cannot read the package.
          GITHUB_TOKEN: ${{ secrets.BUN_AUTH_TOKEN || github.token }}
        run: bun run install:all

      - name: Chromatic - React
        working-directory: react
        env:
          CHROMATIC_TOKEN_REACT: ${{ secrets.CHROMATIC_TOKEN_REACT }}
        run: |
          if [ -n "$CHROMATIC_TOKEN_REACT" ]; then
            bun run storybook:build
            bun run chromatic
          else
            echo "CHROMATIC_TOKEN_REACT not set; skipping React Chromatic run."
          fi

      - name: Chromatic - Vue
        working-directory: vue
        env:
          CHROMATIC_TOKEN_VUE: ${{ secrets.CHROMATIC_TOKEN_VUE }}
        run: |
          if [ -n "$CHROMATIC_TOKEN_VUE" ]; then
            bun run storybook:build
            bun run chromatic
          else
            echo "CHROMATIC_TOKEN_VUE not set; skipping Vue Chromatic run."
          fi

      - name: Chromatic - Svelte
        working-directory: svelte
        env:
          CHROMATIC_TOKEN_SVELTE: ${{ secrets.CHROMATIC_TOKEN_SVELTE }}
        run: |
          if [ -n "$CHROMATIC_TOKEN_SVELTE" ]; then
            bun run storybook:build
            bun run chromatic
          else
            echo "CHROMATIC_TOKEN_SVELTE not set; skipping Svelte Chromatic run."
          fi

      - name: Chromatic - Angular
        working-directory: angular
        env:
          CHROMATIC_TOKEN_ANGULAR: ${{ secrets.CHROMATIC_TOKEN_ANGULAR }}
        run: |
          if [ -n "$CHROMATIC_TOKEN_ANGULAR" ]; then
            bun run storybook:build
            bun run chromatic
          else
            echo "CHROMATIC_TOKEN_ANGULAR not set; skipping Angular Chromatic run."
          fi

  # Move the referenced Linear ticket to "In Progress" and post the preview URL.
  # Ticket refs (e.g. [ELY-5]) in the PR title or branch name are optional —
  # the step is a no-op when none are found.
  linear:
    needs: preview
    if: always() && needs.preview.result == 'success'
    uses: josh803316/shared-ci-workflows/.github/workflows/linear-pr-handler.yml@main
    with:
      event_type: PR_OPENED
      pr_title: ${{ github.event.pull_request.title }}
      branch_name: ${{ github.head_ref }}
      preview_url: ${{ needs.preview.outputs.deployment-url }}
      ticket_prefix: ELY
    secrets: inherit
